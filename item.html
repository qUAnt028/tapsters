<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Item — Tapsters</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <div id="not-found" class="empty hidden mt-24">Item not found.</div>

    <article id="item-root" class="hidden">
      <div class="item-detail">
        <div class="item-image" id="item-image">📦</div>
        <div class="item-info">
          <div class="muted" id="item-category"></div>
          <h1 id="item-title"></h1>
          <div class="row gap-12">
            <div class="price" id="item-price"></div>
            <span class="muted" id="item-currency"></span>
          </div>
          <div class="desc" id="item-desc"></div>

          <div class="seller-card" id="seller-card">
            <div class="seller-avatar" id="seller-avatar">T</div>
            <div style="flex:1; min-width:0">
              <div class="muted" style="font-size:.85rem">Sold by</div>
              <a id="seller-link" href="#" style="font-weight:700; color:var(--purple-800)">…</a>
              <div class="row gap-12" style="margin-top:2px">
                <span class="stars" id="seller-stars" data-readonly="true"></span>
                <span class="muted" id="seller-rating-text"></span>
              </div>
            </div>
            <a class="btn secondary" id="seller-profile-btn" href="#">View profile</a>
          </div>

          <div class="row mt-24" style="gap:10px; flex-wrap:wrap">
            <button class="btn" id="add-cart-btn">Add to cart</button>
            <button class="btn secondary" id="buy-now-btn">Buy now</button>
            <button class="btn danger hidden" id="delete-btn">Delete listing</button>
          </div>
          <div id="add-error" class="error hidden mt-12"></div>
        </div>
      </div>

      <p class="muted mt-24" style="text-align:center">
        Reviews and ratings live on the <strong>seller's profile</strong>. Open the seller above to leave a review.
      </p>
    </article>
  </main>

  <footer class="site-footer"><div class="container">© Tapsters</div></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/currency.js"></script>
  <script src="js/recently.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/header.js"></script>
  <script src="js/item.js"></script>
</body>
</html>
