<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Item — Tapsters</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <div id="not-found" class="empty hidden mt-24">Item not found.</div>

    <article id="item-root" class="hidden">
      <div class="item-detail">
        <div class="item-image" id="item-image">📦</div>
        <div class="item-info">
          <div class="muted" id="item-category"></div>
          <h1 id="item-title"></h1>
          <div class="row gap-12">
            <div class="price" id="item-price"></div>
            <span class="muted" id="item-currency"></span>
          </div>
          <div class="row gap-12 mt-12">
            <span class="stars" id="item-avg-stars" data-readonly="true"></span>
            <span class="muted" id="item-avg-text"></span>
          </div>
          <div class="desc" id="item-desc"></div>
          <div class="muted">Sold by <strong id="item-seller">…</strong></div>

          <div class="row mt-24" style="gap:10px">
            <button class="btn" id="add-cart-btn">Add to cart</button>
            <button class="btn secondary" id="buy-now-btn">Buy now</button>
          </div>
          <div id="add-error" class="error hidden mt-12"></div>
        </div>
      </div>

      <section class="section">
        <h2>Reviews & comments</h2>

        <div id="comment-gate" class="notice hidden">
          <a href="auth.html?next=item.html">Log in</a> to leave a rating or comment.
        </div>

        <form id="comment-form" class="form-card hidden" style="margin: 0 0 18px;">
          <div class="form-row">
            <label>Your rating</label>
            <span class="stars" id="rating-input"></span>
          </div>
          <div class="form-row">
            <label for="comment-content">Your comment</label>
            <textarea id="comment-content" rows="3" placeholder="Share your thoughts…"></textarea>
          </div>
          <button class="btn" type="submit">Post review</button>
        </form>

        <div id="comments-list"></div>
      </section>
    </article>
  </main>

  <footer class="site-footer"><div class="container">© Tapsters</div></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/currency.js"></script>
  <script src="js/recently.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/header.js"></script>
  <script src="js/item.js"></script>
</body>
</html>
