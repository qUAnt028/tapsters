<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Мій кабінет — Tapsters</title>
  <script>(function(){try{var t=localStorage.getItem("tap.theme");if(!t&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)t="dark";if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
  <link rel="stylesheet" href="css/styles.css?v=20260601c" />
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <div id="auth-gate" class="form-card hidden">
      <h1>Будь ласка увійдіть в акаунт.</h1>
      <p>Особистий кабінет доступний лише зареєстрованим користувачам.</p>
      <a class="btn" href="auth.html?next=cabinet.html">Вхід</a>
      <a class="btn secondary" href="auth.html?next=cabinet.html#register">Реєстрація</a>
    </div>

    <section id="cabinet-root" class="hidden">
      <h1 style="margin: 24px 0 8px; color: var(--purple-800)">Мій кабінет</h1>
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="orders">Замовлення</button>
        <button class="tab" data-tab="listings">Мої оголошення</button>
        <button class="tab" data-tab="messages">Повідомлення</button>
        <button class="tab" data-tab="account">Інфо акаунта</button>
        <button class="tab hidden" data-tab="admin" id="admin-tab-btn">Адмін</button>
      </div>

      <div id="tab-orders" class="tab-pane">
        <div id="orders-list"></div>
      </div>

      <div id="tab-listings" class="tab-pane hidden">
        <div id="listings-list"></div>
      </div>

      <div id="tab-messages" class="tab-pane hidden">
        <div id="messages-list"></div>
      </div>

      <div id="tab-admin" class="tab-pane hidden">
        <div class="admin-banner">
          <strong>Режим адміністратора.</strong>
          Ви бачите всі оголошення та всіх користувачів. Видалення неможливо відмінити.
        </div>
        <h2 style="margin: 8px 0; color: var(--purple-800)">Усі оголошення</h2>
        <div id="admin-listings-list"></div>
        <h2 style="margin: 24px 0 8px; color: var(--purple-800)">Усі акаунти</h2>
        <div id="admin-users-list"></div>
      </div>

      <div id="tab-account" class="tab-pane hidden">
        <div class="form-card" style="margin: 0; max-width: 560px;">
          <h2 style="margin-top:0; color: var(--purple-800)">Інфо акаунта</h2>
          <div id="account-error" class="error hidden"></div>
          <div id="account-success" class="success hidden"></div>
          <form id="account-form">
            <div class="form-row">
              <label>Email</label>
              <input type="email" id="account-email" disabled />
            </div>
            <div class="form-grid-2">
              <div class="form-row">
                <label for="account-username">Імʼя користувача</label>
                <input type="text" id="account-username" />
              </div>
              <div class="form-row">
                <label for="account-name">Повне імʼя</label>
                <input type="text" id="account-name" />
              </div>
            </div>
            <div class="row" style="gap:8px">
              <button class="btn" type="submit">Зберегти зміни</button>
              <button class="btn secondary" type="button" id="logout-btn">Вийти</button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer"><div class="container">© Tapsters Original</div></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/theme.js?v=20260601c"></script>
  <script src="js/config.js?v=20260601c"></script>
  <script src="js/supabase.js?v=20260601c"></script>
  <script src="js/currency.js?v=20260601c"></script>
  <script src="js/recently.js?v=20260601c"></script>
  <script src="js/cart.js?v=20260601c"></script>
  <script src="js/header.js?v=20260601c"></script>
  <script src="js/notifications.js?v=20260601c"></script>
  <script src="js/admin.js?v=20260601c"></script>
  <script src="js/cabinet.js?v=20260601c"></script>
</body>
</html>
