<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tapsters</title>
  <meta name="description" content="Tapsters — дружній фіолетовий маркетплейс, де можна купувати та продавати." />
  <!-- Inline FOUC guard: read the saved theme synchronously so <html> has
       the right data-theme attribute before the stylesheet paints. -->
  <script>(function(){try{var t=localStorage.getItem("tap.theme");if(!t&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)t="dark";if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
  <link rel="stylesheet" href="css/styles.css?v=20260601c" />
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <section class="hero">
      <div>
        <h1>Tapsters</h1>
        <p>Купуй та продавай що заманеться на Tapsters.</p>
      </div>
      <button class="cta" id="hero-cta">Почати продаж</button>
    </section>

    <section class="section">
      <div class="between">
        <h2 id="page-title">Свіжі оголошення</h2>
        <label class="currency-pick">
          <span class="muted">Валюта:</span>
          <span class="select-wrap">
            <select id="currency-select" class="select" aria-label="Валюта відображення">
              <option value="USD">USD ($)</option>
              <option value="EUR">EUR (€)</option>
              <option value="GBP">GBP (£)</option>
              <option value="UAH">UAH (₴)</option>
            </select>
          </span>
        </label>
      </div>

      <div id="listing-grid" class="grid"></div>
      <div id="listing-empty" class="empty hidden">Нажаль, нічого немає(</div>
    </section>

    <section class="section" id="recent-section">
      <div class="between">
        <h2 style="margin:0">Останні переглянуті</h2>
        <button class="btn secondary small hidden" id="clear-recent-btn" type="button">Очистити</button>
      </div>
      <div id="recent-grid" class="grid"></div>
      <div id="recent-empty" class="empty">Подивіться будь-який товар, та він одразу з'явиться тут)</div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">© Tapsters Original.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/theme.js?v=20260601c"></script>
  <script src="js/config.js?v=20260601c"></script>
  <script src="js/supabase.js?v=20260601c"></script>
  <script src="js/currency.js?v=20260601c"></script>
  <script src="js/recently.js?v=20260601c"></script>
  <script src="js/cart.js?v=20260601c"></script>
  <script src="js/header.js?v=20260601c"></script>
  <script src="js/notifications.js?v=20260601c"></script>
  <script src="js/main.js?v=20260601c"></script>
</body>
</html>
