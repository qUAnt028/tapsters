<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tapsters</title>
  <script>(function(){try{var t=localStorage.getItem("tap.theme");if(!t&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)t="dark";if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
  <link rel="stylesheet" href="css/styles.css?v=20260611d" />
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <div class="form-card">
      <h1>Додати товар</h1>
      <p class="muted">Продавати речі можна лише зареєстрованим користувачам.</p>

      <div id="auth-gate" class="notice hidden">
        Ви маєте <a href="auth.html?next=create-listing.html">Увійти</a> або
        <a href="auth.html?next=create-listing.html#register">створити акаунт</a> щоб продавати речі.
      </div>

      <div id="form-error" class="error hidden"></div>
      <div id="form-success" class="success hidden"></div>

      <form id="listing-form" class="hidden">
        <div class="form-row">
          <label for="title">Назва</label>
          <input type="text" id="title" required maxlength="120" placeholder="Вінтажна фіолетова куртка" />
        </div>

        <div class="form-row">
          <label for="description">Коротенький опис</label>
          <textarea id="description" rows="5" placeholder="Опишіть стан, бренд, розмір…"></textarea>
        </div>

        <div class="form-row">
          <label for="category">Категорія товару</label>
          <select id="category" required></select>
        </div>

        <div class="form-grid-2">
          <div class="form-row">
            <label for="price">Ціна</label>
            <input type="number" id="price" required min="0" step="0.01" placeholder="9.99" />
          </div>
          <div class="form-row">
            <label>Валюта</label>
            <div class="cur-pick" role="radiogroup" aria-label="Валюта">
              <label><input type="radio" name="currency" value="USD" checked /><span>$ USD</span></label>
              <label><input type="radio" name="currency" value="EUR" /><span>€ EUR</span></label>
              <label><input type="radio" name="currency" value="GBP" /><span>£ GBP</span></label>
              <label><input type="radio" name="currency" value="UAH" /><span>₴ UAH</span></label>
            </div>
          </div>
        </div>

        <div class="form-row">
          <label>Фото товару <span class="muted">(Опціонально, до 8 фото)</span></label>
          <div class="photo-uploader">
            <div class="photo-thumbs" id="photo-thumbs"></div>
            <button type="button" class="btn secondary" id="add-photo-btn">+ Додати фото</button>
            <input type="file" id="photo-input" accept="image/*" multiple hidden />
          </div>
          <div class="muted" style="font-size:.8rem; margin-top:4px">Оберіть фото з пам'яті пристрою — кожне можна обрізати до потрібного співвідношення сторін. Перше фото стане головним.</div>
        </div>

        <button class="btn full" type="submit" id="submit-btn">Створити лот</button>
      </form>
    </div>
  </main>

  <footer class="site-footer"><div class="container">© Tapsters Original</div></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/theme.js?v=20260611d"></script>
  <script src="js/config.js?v=20260611d"></script>
  <script src="js/supabase.js?v=20260611d"></script>
  <script src="js/currency.js?v=20260611d"></script>
  <script src="js/recently.js?v=20260611d"></script>
  <script src="js/cart.js?v=20260611d"></script>
  <script src="js/header.js?v=20260611d"></script>
  <script src="js/notifications.js?v=20260611d"></script>
  <script src="js/photos.js?v=20260611d"></script>
  <script src="js/listing.js?v=20260611d"></script>
</body>
</html>
